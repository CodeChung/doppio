<div class="flex h-screen">
  <!-- Sidebar -->
  <div class="bg-gray-800 text-white w-64 p-4 transition-all duration-300" [class.w-16]="!sidebarOpen">
    <button class="mb-4" (click)="sidebarOpen = !sidebarOpen">☰</button>
    <nav>
      <ul>
        <li (click)="activeTab = 'home'">🏠 Home</li>
        <li (click)="activeTab = 'recent'">📜 Recent</li>
        <li (click)="activeTab = 'settings'">⚙ Settings</li>
      </ul>
    </nav>
  </div>

  <!-- Main Content -->
  <div class="flex-1 p-6">
    <div *ngIf="activeTab === 'home'">
      <h2 class="text-2xl font-bold">Minimal Journal</h2>
      <div class="flex justify-end text-gray-500">{{ currentDate }}</div>

      <!-- Editor.js Container -->
      <div #editor class=" p-4 mt-4"></div>

      <button (click)="addEntry()" class="bg-blue-500 text-white p-2 mt-2">Add Entry</button>
    </div>

    <div *ngIf="activeTab === 'recent'">
      <h2 class="text-2xl font-bold">Recent Entries</h2>
      <div *ngFor="let entry of journalEntries; let i = index" class="p-2 border mt-2">
        <p><strong>{{ entry.date }}</strong></p>
        <!-- <div [innerHTML]="entry.content.blocks.map(block => `<p>${block.data.text}</p>`).join('')"></div> -->
        <button (click)="deleteEntry(i)" class="text-red-500">Delete</button>
      </div>
    </div>

    <div *ngIf="activeTab === 'settings'">
      <h2 class="text-2xl font-bold">Settings</h2>
      <p>Settings section (to be expanded later)</p>
    </div>
  </div>
</div>
